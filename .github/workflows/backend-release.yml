name: Backend Docker Release

on:
  push:
    tags:
      - "backend/v*"

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/beerpong-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Log trigger info
        run: |
          echo "=========================================="
          echo "  Triggered by tag : ${{ github.ref_name }}"
          echo "  Commit SHA        : ${{ github.sha }}"
          echo "  Actor             : ${{ github.actor }}"
          echo "  Target image      : ${{ env.IMAGE_REPOSITORY }}"
          echo "=========================================="

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # - name: Run tests
      #   working-directory: go
      #   run: go test ./pkg/...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Log resolved image tags
        run: |
          echo "=========================================="
          echo "  Image tags to be pushed:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/    - /'
          echo "=========================================="

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./go
          file: ./go/dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Log push result
        run: |
          echo "=========================================="
          echo "  Build & push complete"
          echo "  Image digest : ${{ steps.build.outputs.digest }}"
          echo "  Pull command : docker pull ${{ env.IMAGE_REPOSITORY }}:${{ github.ref_name }}"
          echo "=========================================="
