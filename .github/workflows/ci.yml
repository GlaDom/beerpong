name: CI

on:
  pull_request:

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ngBeerpong
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ngBeerpong/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

