# Production stack — skbeerpong.com
#
# First-time VPS setup:
#   1. Fill in traefik/traefik.yml (ACME email) and traefik/dynamic.yml (htpasswd hash)
#   2. mkdir traefik/letsencrypt && touch traefik/letsencrypt/acme.json && chmod 600 traefik/letsencrypt/acme.json
#   3. cp .env.example .env  and fill in all values
#   4. Create config.json next to this file — DB host must be "localhost" (not "db")
#   5. docker compose pull && docker compose up -d
#
# Update to a new image:
#   FRONTEND_TAG=frontend/v0.2.0 BACKEND_TAG=backend/v0.3.0 docker compose up -d --no-deps frontend backend

services:

  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic.yml:/dynamic.yml:ro
      - ./traefik/letsencrypt:/letsencrypt
      - ./traefik/resolv.conf:/etc/resolv.conf
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.skbeerpong.com`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.dashboard.service=api@internal
      # Middleware is defined in traefik/dynamic.yml — @file suffix required
      - traefik.http.routers.dashboard.middlewares=dashboard-auth@file

  frontend:
    image: ${DOCKERHUB_USERNAME}/beerpong-frontend:${FRONTEND_TAG:-latest}
    container_name: frontend
    restart: unless-stopped
    network_mode: host
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`skbeerpong.com`) || Host(`www.skbeerpong.com`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=8081

  backend:
    image: ${DOCKERHUB_USERNAME}/beerpong-backend:${BACKEND_TAG:-latest}
    container_name: backend
    restart: unless-stopped
    network_mode: host
    volumes:
      # Auth0 + DB credentials — DB host must be "localhost"
      - ./config.json:/app/config.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`skbeerpong.com`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.routers.backend.priority=10
      - traefik.http.services.backend.loadbalancer.server.port=8082
