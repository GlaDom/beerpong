<p-confirmdialog/>
<ng-container *ngIf="!showRanking">
    <p-tabView>
        <p-tabPanel header="Gruppen A-C">
            <div class="flex">
                @if(groups.length <= 3) {
                    @for(g of groups; track $index; let i = $index) {
                        <div class="flex flex-col flex-1 w-full">
                            <ng-container *ngFor="let m of sortedMatches[i]">
                                <app-game-card [match]="m" class="w-full"></app-game-card>
                            </ng-container>
                        </div>
                    }
                } @else {
                    @for(g of groups.slice(0, 3); track $index; let i = $index) {
                        <div class="flex flex-col flex-1 w-full">
                            <ng-container *ngFor="let m of sortedMatches[i]">
                                <app-game-card [match]="m" class="w-full"></app-game-card>
                            </ng-container>
                        </div>
                    }
                }
            </div>
        </p-tabPanel>
        <ng-container *ngIf="groups.length > 3">
            <p-tabPanel header="Gruppen D-F">
               @for(g of groups.slice(3, groups.length); track $index; let i = $index) {
                    <div class="flex flex-col flex-1 w-full">
                        <ng-container *ngFor="let m of sortedMatches[i]">
                            <app-game-card [match]="m" class="w-full"></app-game-card>
                        </ng-container>
                    </div>
                }
            </p-tabPanel>
        </ng-container>
    </p-tabView>
    <div class="flex flex-row-reverse mt-5">
        <p-button (onClick)="updateRoundOfSixteen()" label="Gruppenphase abschliessen"></p-button>
    </div>
    <ng-container *ngIf="roundOfsixteen.length > 0">
        <div>
            <p-fieldset legend="Achtelfinals">
                <div class="flex flex-wrap">
                    <ng-container *ngFor="let m of roundOfsixteen">
                        <div class="">
                            <app-game-card [match]="m"></app-game-card>
                        </div>
                    </ng-container>
                </div>
            </p-fieldset>
        </div>
        <div class="flex flex-row-reverse mt-5">
            <p-button (onClick)="updateQuaterFinals()" label="Achtelfinals abschliessen"></p-button>
        </div>
    </ng-container>
    <ng-container *ngIf="quaterFinalMatches.length > 0">
        <div>
            <p-fieldset legend="Viertelfinals">
                <div class="flex flex-row">
                    <ng-container *ngFor="let m of quaterFinalMatches">
                        <div class="flex-1">
                            <app-game-card [match]="m"></app-game-card>
                        </div>
                    </ng-container>
                </div>
            </p-fieldset>
        </div>
        <div class="flex flex-row-reverse mt-5">
            <p-button (onClick)="updateSemiFinals()" label="Viertelfinal abschliessen"></p-button>
        </div>
    </ng-container>
    <div class="mt-5">
        <p-fieldset legend="Halbfinals">
            <div class="flex flex-row">
                <ng-container *ngFor="let m of semiFinalMatches">
                    <div class="flex-1">
                        <app-game-card [match]="m"></app-game-card>
                    </div>
                </ng-container>
            </div>
        </p-fieldset>
    </div>
    <div class="flex flex-row-reverse mt-5">
        <p-button (onClick)="updateFinal()" label="Halbfinals abschliessen"></p-button>
    </div>
    <ng-container *ngIf="thirdPlaceMatch.length > 0">
        <div class="mt-5">
            <p-fieldset legend="Spiel um Platz 3">
                <div class="flex flex-row justify-around">
                    <ng-container *ngFor="let m of thirdPlaceMatch">
                        <div class="w-1/2">
                            <app-game-card [match]="m"></app-game-card>
                        </div>
                    </ng-container>
                </div>
            </p-fieldset>
        </div>
    </ng-container>
    <div class="mt-5">
        <p-fieldset legend="Finale">
            <div class="flex flex-row justify-around">
                <ng-container *ngFor="let m of finalMatches">
                    <div class="w-1/2">
                        <app-game-card [match]="m"></app-game-card>
                    </div>
                </ng-container>
            </div>
        </p-fieldset>
    </div>
    <div class="flex flex-row justify-between mt-5">
        <p-button severity="danger" (onClick)="confirmGameFinish($event)" label="Spiel sofort beenden"></p-button>
        <p-button (onClick)="setTournamentFinished()" label="Zur Tabelle"></p-button>
    </div>
</ng-container>
<ng-container *ngIf="showRanking">
    <div class="">
        <app-ranking [teams]="getRanking()">
            <div class="flex gap-3 mt-1">
                <p-button label="Zurueck" (onClick)="backToAdminSpace()"></p-button>
                <p-button label="Spiel beenden" (onClick)="confirmGameFinish($event)"></p-button>
            </div>
        </app-ranking>
    </div>
</ng-container>
