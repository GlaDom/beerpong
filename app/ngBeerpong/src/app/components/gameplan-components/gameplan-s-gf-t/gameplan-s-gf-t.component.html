<ng-container>
    <div class="flex flex-row mb-2 gap-1.5">
        <ng-container *ngIf="groups.length>1">
            <ng-container *ngFor="let g of groups">
                <div class="flex-1">
                    <app-group-card [group]="g"></app-group-card>
                </div>
            </ng-container>
        </ng-container>
    </div>
    <hr />
    <div class="max-h-screen overflow-y-auto">
        <div class="flex gap-2">
            @for(g of groups; track $index; let i = $index) {
                <div class="flex flex-col flex-1 w-full">
                    <ng-container *ngFor="let m of regularMatches[i]">
                        <app-gameplan-card [match]="m" class="w-full"></app-gameplan-card>
                    </ng-container>
                </div>    
            }
        </div>
        <div class="mt-5 gap-1.5">
            <ng-container *ngIf="roundOfSixteenMatches.length > 0">
                <p-fieldset legend="Achtelfinals">
                    <div class="flex flex-row gap-1.5">
                        <ng-container *ngFor="let m of roundOfSixteenMatches">
                            <div class="flex-1">
                                <app-gameplan-card [match]="m" [showGroupName]="false"></app-gameplan-card>
                            </div>
                        </ng-container>
                    </div>
                </p-fieldset>
            </ng-container>
        </div>
        <div class="mt-5 gap-1.5">
            <ng-container *ngIf="quarterFinalMatches.length > 0 ">
                <p-fieldset legend="Viertelfinals">
                    <div class="flex flex-row gap-1.5">
                        <ng-container *ngFor="let m of quarterFinalMatches">
                            <div class="flex-1">
                                <app-gameplan-card [match]="m" [showGroupName]="false"></app-gameplan-card>
                            </div>
                        </ng-container>
                    </div>
                </p-fieldset>
            </ng-container>
        </div>
        <div class="mt-5">
            <ng-container *ngIf="semiFinalMatches.length > 0">
                <p-fieldset legend="Halbfinals">
                    <div class="flex flex-row gap-1.5">
                        <ng-container *ngFor="let m of semiFinalMatches">
                            <div class="flex-1">
                                <app-gameplan-card [match]="m" [showGroupName]="false"></app-gameplan-card>
                            </div>
                        </ng-container>
                    </div>
                </p-fieldset>
            </ng-container>
        </div>
        <div class="mt-5">
            <p-fieldset legend="Finale">
                <div class="flex flex-row justify-around">
                    <ng-container *ngFor="let m of finalMatches">
                        <div class="w-1/2">
                            <app-gameplan-card [match]="m" [showGroupName]="false"></app-gameplan-card>
                        </div>
                    </ng-container>
                </div>
            </p-fieldset>
        </div>
    </div>
</ng-container>
