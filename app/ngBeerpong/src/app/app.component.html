@if (isLoggedIn()) {
  <nav class="app-nav">
    <div class="nav-inner">

      <!-- Brand -->
      <a routerLink="/home" class="nav-brand">
        <svg width="24" height="24" viewBox="0 0 40 40" class="nav-rack">
          <g fill="var(--cup)">
            <circle cx="11" cy="11" r="5.2"/>
            <circle cx="20" cy="11" r="5.2"/>
            <circle cx="29" cy="11" r="5.2"/>
            <circle cx="15.5" cy="20" r="5.2"/>
            <circle cx="24.5" cy="20" r="5.2"/>
            <circle cx="20" cy="29" r="5.2"/>
          </g>
          <g fill="var(--bg)" opacity="0.45">
            <circle cx="11" cy="11" r="2.1"/>
            <circle cx="20" cy="11" r="2.1"/>
            <circle cx="29" cy="11" r="2.1"/>
            <circle cx="15.5" cy="20" r="2.1"/>
            <circle cx="24.5" cy="20" r="2.1"/>
            <circle cx="20" cy="29" r="2.1"/>
          </g>
        </svg>
        <span class="wordmark">
          <span style="letter-spacing:-0.05em">SK</span>
          <span class="dot"></span>
          <span style="letter-spacing:-0.04em">Beerpong</span>
        </span>
      </a>

      <!-- Pill nav -->
      <nav class="nav-pills">
        <a routerLink="/home" routerLinkActive="pill-active"
           [routerLinkActiveOptions]="{exact:true}" class="nav-pill">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Home
        </a>
        <a routerLink="/adminspace" routerLinkActive="pill-active" class="nav-pill">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m14 13-7.5 7.5"/><path d="M16 16 3 3"/><path d="M9 5 5 9"/><path d="m19 11-4 4"/>
          </svg>
          Turnier
        </a>
        <a routerLink="/gameplan" routerLinkActive="pill-active" class="nav-pill">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
          </svg>
          Spielplan
        </a>
      </nav>

      <!-- Right: user + actions -->
      <div class="nav-end">
        <div class="nav-user">
          <div class="nav-avatar">{{ userInitials() }}</div>
          <div class="nav-user-info">
            <span class="nav-username">{{ userName() }}</span>
            <span class="nav-role">Organisator</span>
          </div>
        </div>
        <button class="nav-icon-btn" (click)="toggleDarkMode()" title="Dark/Light Mode">
          @if (darkModeOn) {
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2m-8-8H2m20 0h-2m-2.34-5.66-1.42 1.42M6.34 17.66l-1.41 1.41m12.73 0-1.41-1.41M6.34 6.34 4.93 4.93"/>
            </svg>
          } @else {
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          }
        </button>
        <button class="nav-icon-btn" (click)="logout()" title="Abmelden">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

    </div>
  </nav>
}

<router-outlet></router-outlet>
